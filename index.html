<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eden</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1016;
        color: #dce6f0;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* The overlay must not swallow camera drags; panels opt back in. */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .panel {
        pointer-events: auto;
        position: absolute;
        top: 1rem;
        left: 1rem;
        min-width: 11rem;
        padding: 0.75rem 1rem;
        border: 1px solid #23303d;
        border-radius: 0.5rem;
        background: #0f161ee6;
        backdrop-filter: blur(6px);
      }
      .panel h1 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7fd4a0;
      }
      .panel dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.15rem 0.75rem;
        margin: 0 0 0.75rem;
        font-size: 0.85rem;
      }
      .panel dt {
        color: #7d8fa1;
      }
      .panel dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .panel button {
        width: 100%;
        padding: 0.4rem;
        border: 1px solid #2f4a3c;
        border-radius: 0.3rem;
        background: #17251d;
        color: #9fe0bb;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .panel button:hover {
        background: #1e3226;
      }
      .panel--right {
        left: auto;
        right: 1rem;
        min-width: 15rem;
      }
      .panel h2 {
        margin: 0 0 0.35rem;
        font-size: 0.9rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9fb4c8;
      }
      .dim {
        color: #64798c;
        font-variant-numeric: tabular-nums;
      }
      .terrain {
        margin: 0 0 0.75rem;
        font-size: 0.8rem;
        letter-spacing: 0.1em;
      }
      .terrain--water {
        color: #58a6d8;
      }
      .terrain--soil {
        color: #b08a5c;
      }
      .terrain--rock {
        color: #8d8d99;
      }
      .terrain--air {
        color: #7d8fa1;
      }
      .bars {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.3rem;
        font-size: 0.75rem;
      }
      .bars li {
        display: grid;
        grid-template-columns: 4.5rem 1fr 2.2rem;
        align-items: center;
        gap: 0.5rem;
      }
      .bars__label {
        color: #7d8fa1;
      }
      .bars__track {
        position: relative;
        height: 0.5rem;
        border-radius: 0.25rem;
        background: #1b2733;
        overflow: hidden;
      }
      .bars__fill {
        position: absolute;
        inset: 0 auto 0 0;
        background: linear-gradient(90deg, #2f6f52, #7fd4a0);
      }
      /* Tick marking the resting level: current vs. baseline is what shows depletion. */
      .bars__baseline {
        position: absolute;
        top: -1px;
        bottom: -1px;
        width: 1px;
        background: #e4b363;
      }
      .bars__value {
        text-align: right;
        color: #b7c6d4;
        font-variant-numeric: tabular-nums;
      }
      .hint {
        position: absolute;
        right: 1rem;
        top: 1rem;
        margin: 0;
        font-size: 0.75rem;
        color: #4d5f70;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
