<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eden</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1016;
        color: #dce6f0;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* The overlay must not swallow camera drags; panels opt back in. */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .panel {
        pointer-events: auto;
        position: absolute;
        top: 1rem;
        left: 1rem;
        min-width: 11rem;
        padding: 0.75rem 1rem;
        border: 1px solid #23303d;
        border-radius: 0.5rem;
        background: #0f161ee6;
        backdrop-filter: blur(6px);
      }
      .panel h1 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7fd4a0;
      }
      .panel dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.15rem 0.75rem;
        margin: 0 0 0.75rem;
        font-size: 0.85rem;
      }
      .panel dt {
        color: #7d8fa1;
      }
      .panel dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .panel button {
        width: 100%;
        padding: 0.4rem;
        border: 1px solid #2f4a3c;
        border-radius: 0.3rem;
        background: #17251d;
        color: #9fe0bb;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .panel button:hover {
        background: #1e3226;
      }
      .panel--right {
        left: auto;
        right: 1rem;
        min-width: 15rem;
      }
      .panel h2 {
        margin: 0 0 0.35rem;
        font-size: 0.9rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9fb4c8;
      }
      .dim {
        color: #64798c;
        font-variant-numeric: tabular-nums;
      }
      .terrain {
        margin: 0 0 0.75rem;
        font-size: 0.8rem;
        letter-spacing: 0.1em;
      }
      .terrain--water {
        color: #58a6d8;
      }
      .terrain--soil {
        color: #b08a5c;
      }
      .terrain--rock {
        color: #8d8d99;
      }
      .terrain--air {
        color: #7d8fa1;
      }
      .bars {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.3rem;
        font-size: 0.75rem;
      }
      .bars li {
        display: grid;
        grid-template-columns: 4.5rem 1fr 2.2rem;
        align-items: center;
        gap: 0.5rem;
      }
      .bars__label {
        color: #7d8fa1;
      }
      .bars__track {
        position: relative;
        height: 0.5rem;
        border-radius: 0.25rem;
        background: #1b2733;
        overflow: hidden;
      }
      .bars__fill {
        position: absolute;
        inset: 0 auto 0 0;
        background: linear-gradient(90deg, #2f6f52, #7fd4a0);
      }
      /* Tick marking the resting level: current vs. baseline is what shows depletion. */
      .bars__baseline {
        position: absolute;
        top: -1px;
        bottom: -1px;
        width: 1px;
        background: #e4b363;
      }
      .bars__value {
        text-align: right;
        color: #b7c6d4;
        font-variant-numeric: tabular-nums;
      }
      .hint {
        position: absolute;
        right: 1rem;
        top: 1rem;
        margin: 0;
        font-size: 0.75rem;
        color: #4d5f70;
      }
      .panel--right {
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
      }
      .panel button.ghost {
        margin-top: 0.35rem;
        border-color: #2b3742;
        background: #141c24;
        color: #8fa3b6;
      }
      .empty {
        margin: 0.75rem 0 0;
        font-size: 0.75rem;
        color: #4d5f70;
      }
      .creature {
        margin-top: 0.85rem;
        padding-top: 0.6rem;
        border-top: 1px solid #1d2833;
      }
      .creature h3 {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin: 0 0 0.3rem;
        font-size: 0.82rem;
      }
      .creature__dot {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
      }
      .creature__vitals {
        display: flex;
        gap: 0.9rem;
        margin: 0 0 0.4rem;
        font-size: 0.72rem;
        color: #7d8fa1;
      }
      .creature__vitals b {
        color: #dce6f0;
        font-variant-numeric: tabular-nums;
      }
      .actions {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.7rem;
      }
      .actions__row td {
        padding: 0.1rem 0;
      }
      .actions__name {
        width: 6.5rem;
        color: #8fa3b6;
      }
      .actions__why {
        position: relative;
        height: 0.55rem;
        color: #6b4f4f;
      }
      .actions__bar {
        display: block;
        height: 0.35rem;
        border-radius: 0.2rem;
        background: #3f6f57;
      }
      .actions__score {
        width: 2.4rem;
        text-align: right;
        color: #9fb4c8;
        font-variant-numeric: tabular-nums;
      }
      /* Unowned actions are absent; gated ones exist but a tag blocks them. */
      .actions__row--unowned {
        opacity: 0.28;
      }
      .actions__row--gated .actions__name {
        color: #a06b6b;
        text-decoration: line-through;
      }
      .actions__row--inert {
        opacity: 0.55;
      }
      .actions__row--chosen .actions__name {
        color: #7fd4a0;
        font-weight: 700;
      }
      .actions__row--chosen .actions__bar {
        background: #7fd4a0;
      }
      .panel--log {
        top: auto;
        bottom: 1rem;
        left: 1rem;
        max-width: 22rem;
        max-height: 40vh;
        overflow-y: auto;
      }
      .log {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 0.7rem;
        display: grid;
        gap: 0.12rem;
      }
      .log__line {
        color: #8fa3b6;
      }
      .log__turn {
        display: inline-block;
        width: 2.2rem;
        color: #4d5f70;
        font-variant-numeric: tabular-nums;
      }
      .log__line--died {
        color: #b98080;
      }
      .log__line--born {
        color: #86c9a2;
      }
      .log__line--extinct {
        color: #d98a5a;
        font-weight: 600;
      }
      .log__line--ate {
        color: #c2a86a;
      }
      .log__line--mutated {
        color: #7fd4a0;
        font-weight: 600;
      }
      .warn {
        margin: 0 0 0.5rem;
        font-size: 0.7rem;
        color: #d98a5a;
      }

      /* --- Hand --------------------------------------------------------- */
      .hand {
        position: absolute;
        left: 50%;
        bottom: 1rem;
        transform: translateX(-50%);
        display: flex;
        align-items: flex-end;
        gap: 0.5rem;
        pointer-events: auto;
      }
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        width: 9.5rem;
        min-height: 8.5rem;
        padding: 0.6rem 0.65rem 1.6rem;
        border: 1px solid #23303d;
        border-top: 3px solid #7fd4a0;
        border-radius: 0.45rem;
        background: #0f161eec;
        backdrop-filter: blur(6px);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      .card:hover {
        transform: translateY(-0.25rem);
      }
      .card--selected {
        transform: translateY(-0.6rem);
        box-shadow: 0 0 0 1px #7fd4a0;
      }
      .card--dead {
        opacity: 0.42;
        cursor: not-allowed;
      }
      .card--dead:hover {
        transform: none;
      }
      .card__name {
        font-size: 0.85rem;
        font-weight: 700;
      }
      .card__blurb {
        font-size: 0.66rem;
        line-height: 1.25;
        color: #8fa3b6;
      }
      .card__rules {
        margin-top: auto;
        font-size: 0.62rem;
        color: #64798c;
      }
      .card__rules b {
        color: #4d5f70;
        font-weight: 600;
      }
      .card__reason {
        font-size: 0.62rem;
        line-height: 1.2;
        color: #b98080;
      }
      .card__hint {
        font-size: 0.62rem;
        color: #7fd4a0;
      }
      .card__cycle {
        position: absolute;
        right: 0.5rem;
        bottom: 0.4rem;
        font-size: 0.6rem;
        color: #5b6f82;
        text-decoration: underline;
      }
      .card__cycle:hover {
        color: #9fb4c8;
      }
      .hand__deck {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 0.5rem 0.5rem;
        font-size: 0.65rem;
        color: #64798c;
      }
      .hand__deck b {
        font-size: 1.1rem;
        color: #dce6f0;
      }

      /* --- End of run --------------------------------------------------- */
      .runend {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #060a0ecc;
        pointer-events: auto;
      }
      .runend__card {
        min-width: 20rem;
        padding: 1.5rem 1.75rem;
        border: 1px solid #23303d;
        border-radius: 0.6rem;
        background: #0f161e;
        text-align: center;
      }
      .runend__card h1 {
        margin: 0 0 0.5rem;
        font-size: 1.3rem;
      }
      .runend__won {
        color: #7fd4a0;
      }
      .runend__lost {
        color: #c98686;
      }
      .runend__reason {
        margin: 0 0 1rem;
        font-size: 0.8rem;
        color: #8fa3b6;
      }
      .runend__stats {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.2rem 1rem;
        margin: 0 0 1.2rem;
        font-size: 0.78rem;
        text-align: left;
      }
      .runend__stats dt {
        color: #7d8fa1;
      }
      .runend__stats dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .runend button {
        width: 100%;
        padding: 0.45rem;
        border: 1px solid #2f4a3c;
        border-radius: 0.3rem;
        background: #17251d;
        color: #9fe0bb;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
